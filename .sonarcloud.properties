# Duplication detection is off for the fixture checks.
#
# The file is named .sonarcloud.properties, not sonar-project.properties:
# this project has no scanner in CI, SonarCloud analyses it automatically, and
# automatic analysis reads its configuration from that name. A commit adding
# the other one changed nothing — the reported density stayed at 41 %.
#
# Those files are tables: one entry per case, each stating an input and the
# expected output. SonarCloud normalises string literals before it compares
# token sequences, so fifteen cases that differ only in their strings are
# fifteen identical blocks to the detector — 41 % duplication reported inside a
# single file, against a 3 % gate. The repetition is the format, and removing
# it would mean making the cases harder to read to satisfy a detector that is
# measuring the wrong thing here.
#
# Named one by one rather than as `check-*.php`: a check script added later is
# not necessarily a fixture table, and it should have to be listed here on
# purpose. Everything else, production code included, stays measured.
sonar.cpd.exclusions=Build/Scripts/check-blank-line-after-control-structure.php,Build/Scripts/check-blank-line-before-comment.php,Build/Scripts/check-break-long-method-chain.php
