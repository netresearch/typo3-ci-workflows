name: Release

on:
  workflow_call:
    inputs:
      archive-prefix:
        description: 'Prefix for release archive files (e.g., contexts)'
        required: true
        type: string
      package-name:
        description: 'Composer package name (e.g., netresearch/contexts)'
        required: true
        type: string
      include-sbom:
        description: 'Include SPDX and CycloneDX SBOMs'
        required: false
        type: boolean
        default: true
      sign-artifacts:
        description: 'Sign artifacts with Cosign keyless signing'
        required: false
        type: boolean
        default: true
      make-latest:
        description: >-
          Let this release become the repository's "Latest" release. With
          true, it becomes Latest only when its version is the highest of all
          published, non-prerelease releases, so a maintenance release of an
          older major line leaves the badge — and the /releases/latest
          redirect — on the newest version. false keeps it off Latest in every
          case.
        required: false
        type: boolean
        default: true

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     release:
#       uses: netresearch/typo3-ci-workflows/.github/workflows/release.yml@main
#       permissions:
#         attestations: write
#         contents: write
#         id-token: write
permissions: {}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate inputs
        env:
          ARCHIVE_PREFIX: ${{ inputs.archive-prefix }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$ARCHIVE_PREFIX" == *..* ]] || [[ "$ARCHIVE_PREFIX" == /* ]]; then
            echo "::error::Invalid archive-prefix: must not contain '..' or start with '/'"
            exit 1
          fi
          if [[ "$VERSION" == *..* ]] || [[ "$VERSION" == */* ]]; then
            echo "::error::Invalid version string derived from tag"
            exit 1
          fi

      - name: Generate Release Notes
        id: notes
        run: |
          DELIMITER="ghadelim_$(openssl rand -hex 8)"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            {
              echo "notes<<$DELIMITER"
              echo "Initial release"
              echo "$DELIMITER"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "notes<<$DELIMITER"
              # Wrap bare "@name" mentions from commit subjects in backticks —
              # pasted verbatim into the release body they would link an
              # unrelated GitHub account, list it under the release's
              # contributors and notify that person. Occurrences preceded by a
              # backtick or a word character (code spans, e-mail addresses,
              # "action@v4" refs) are left alone. BT holds a literal backtick:
              # writing one inside the sed script would trip shellcheck SC2016.
              BT=$(printf '\140')
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..HEAD" \
                | sed -E "s/(^|[^${BT}[:alnum:]_])@([[:alnum:]][[:alnum:]-]*)/\\1${BT}@\\2${BT}/g"
              echo ""
              echo "$DELIMITER"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create release archive
        env:
          ARCHIVE_PREFIX: ${{ inputs.archive-prefix }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="${ARCHIVE_PREFIX}/" HEAD -o "dist/${ARCHIVE_PREFIX}-${VERSION}.zip"
          git archive --format=tar.gz --prefix="${ARCHIVE_PREFIX}/" HEAD -o "dist/${ARCHIVE_PREFIX}-${VERSION}.tar.gz"

      - name: Generate SBOM (SPDX)
        if: inputs.include-sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/${{ inputs.archive-prefix }}-${{ steps.version.outputs.version }}.sbom.spdx.json

      - name: Generate SBOM (CycloneDX)
        if: inputs.include-sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/${{ inputs.archive-prefix }}-${{ steps.version.outputs.version }}.sbom.cdx.json

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > checksums.txt
          cat checksums.txt

      - name: Install Cosign
        if: inputs.sign-artifacts
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifacts with Cosign (keyless)
        if: inputs.sign-artifacts
        run: |
          cd dist
          for file in *; do
            [ -f "$file" ] || continue
            case "$file" in
              *.sigstore.json) continue ;;  # don't sign already-generated signature bundles
            esac
            # Use .sigstore.json (Sigstore bundle format) so OSSF Scorecard
            # recognizes the artifact as signed. The bytes are identical to
            # cosign's --bundle output; only the extension differs.
            cosign sign-blob --yes "$file" --bundle "${file}.sigstore.json"
          done

      - name: Generate attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ inputs.archive-prefix }}-${{ steps.version.outputs.version }}.zip
            dist/${{ inputs.archive-prefix }}-${{ steps.version.outputs.version }}.tar.gz

      # GitHub makes a new release Latest unless told otherwise, so a
      # maintenance release of an older major line took the badge and the
      # /releases/latest redirect from the newest version. Only the highest
      # version becomes Latest. The same step runs in
      # release-typo3-extension.yml, where it carries the full explanation;
      # Build/Scripts/check-release-latest.sh runs both and fails if they
      # drift apart.
      - name: Decide whether this release becomes Latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          MAKE_LATEST: ${{ inputs.make-latest }}
        run: |
          set -euo pipefail
          decide() { # true|false, message
            echo "latest=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            exit 0
          }
          if [[ "$MAKE_LATEST" != "true" ]]; then
            decide false "make-latest is false: ${TAG} does not become Latest."
          fi
          VERSION_RE='^[0-9]+\.[0-9]+\.[0-9]+$'
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ $VERSION_RE ]]; then
            echo "::warning::${TAG} is not a vX.Y.Z or X.Y.Z tag and cannot be compared with the other releases, so it does not become Latest."
            decide false "Latest stays where it is."
          fi
          LIST_DIR="$(mktemp -d)"
          # A failed listing must not read as "no other releases": that would
          # make every release Latest, the defect this step exists to prevent.
          # It does not fail the release either; the badge stays where it is.
          if ! gh api --paginate "repos/${REPO}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
              > "${LIST_DIR}/tags" 2> "${LIST_DIR}/err"; then
            echo "::warning::Could not list the releases of ${REPO}, so ${TAG} does not become Latest: $(tr '\n' ' ' < "${LIST_DIR}/err")"
            decide false "Latest stays where it is."
          fi
          # This tag is added explicitly: on the first run its release does
          # not exist yet, and on a re-run it may still be a draft.
          HIGHEST="$({ sed 's/^v//' "${LIST_DIR}/tags"; echo "$VERSION"; } | grep -E "$VERSION_RE" | sort -u -V | tail -n 1)"
          if [[ "$HIGHEST" == "$VERSION" ]]; then
            decide true "${TAG} is the highest released version: it becomes Latest."
          fi
          echo "::notice::${TAG} is lower than the released ${HIGHEST}, so it does not become Latest."
          decide false "Latest stays on ${HIGHEST}."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          make_latest: ${{ steps.latest.outputs.latest }}
          files: |
            dist/*
          body: |
            ## Changes
            ${{ steps.notes.outputs.notes }}

            ## Installation

            ```bash
            composer require ${{ inputs.package-name }}
            ```

            ## Security

            All release artifacts are signed with [Sigstore](https://www.sigstore.dev/) keyless signing.

            ### Verify signatures

            ```bash
            cosign verify-blob \
              --bundle ${{ inputs.archive-prefix }}-${{ steps.version.outputs.version }}.zip.sigstore.json \
              --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ${{ inputs.archive-prefix }}-${{ steps.version.outputs.version }}.zip
            ```

            ### Verify checksums

            ```bash
            sha256sum -c checksums.txt
            ```

            ## Software Bill of Materials (SBOM)

            SBOMs are provided in both SPDX and CycloneDX formats for supply chain transparency.
