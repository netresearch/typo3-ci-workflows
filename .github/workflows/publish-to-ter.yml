name: Publish to TER

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version for tailor
        type: string
        default: '8.4'
      ref:
        description: Git ref (tag or SHA) to check out. Defaults to the event ref — set this explicitly when re-triggering from a workflow_dispatch against a branch to ensure the correct source is packaged.
        required: false
        type: string
        default: ''
      release-notes:
        description: >-
          Changelog text for TER's upload comment. Pass the notes the caller
          already generated; without it this workflow can only read the GitHub
          release body, which does not exist yet when the release is created
          after publishing, leaving TER with the bare fallback link.
        required: false
        type: string
        default: ''
      force-republish:
        description: >-
          Upload even when the version is already on TER. TER accepts a
          re-upload of the same version number and overwrites the stored upload
          comment, which is the only way to correct a comment on a published
          version. Off by default so the normal release path stays idempotent.
        required: false
        type: boolean
        default: false
      verify-timeout-minutes:
        description: Max minutes to wait for TER to serve the published version
        required: false
        type: number
        default: 10
      verify-poll-interval-seconds:
        description: Seconds between TER verification polls
        required: false
        type: number
        default: 30
      job-timeout-minutes:
        description: |
          Hard upper bound on the publish job. Must cover
          `verify-timeout-minutes` plus a buffer (~10 min) for setup,
          install, publish, and metadata-sync. Bump this whenever you
          raise `verify-timeout-minutes` so the verify loop isn't cut
          short by the job budget.
        required: false
        type: number
        default: 25
      update-metadata:
        description: >-
          Sync the TER listing's composer/issues/repository URLs via
          `tailor ter:update`. Runs after publishing, and also on a
          no-op republish when the version is already on TER (so a
          repo rename or URL change reconciles without a new release).
          The manual URL is only written when `manual-url` is
          explicitly set (empty preserves TER's existing value).
          Safe to re-run; TER overwrites each supplied field.
        required: false
        type: boolean
        default: true
      manual-url:
        description: >-
          URL for TER's "External manual" field. If empty (default), the
          existing value on TER is preserved -- in particular, TYPO3
          extensions with composer-docs auto-publish should leave this
          empty so TER auto-links the "Extension Manual" button to
          https://docs.typo3.org/p/<vendor>/<package>/<major>.<minor>/en-us.
          If set, overwrites TER's field with the supplied URL on every
          publish (idempotent). Set to a real docs URL only if your
          extension does NOT auto-publish to docs.typo3.org.
        required: false
        type: string
        default: ''
      tags:
        description: >-
          Comma-separated TER tags, for the listing's discoverability. Empty
          (default) leaves TER's tags untouched. Setting it REPLACES the whole
          list on every release — `tailor ter:update` sends the field verbatim
          and TER overwrites it — so include every tag that should remain, and
          expect anything curated in the TER UI to be overwritten.
        required: false
        type: string
        default: ''
      derive-tags-from-composer:
        description: >-
          Derive the TER tags from composer.json `keywords`, dropping the terms
          TER already implies (typo3, php, extension, cms …) because every
          listing there is a TYPO3 extension and those carry no information.
          Keeps one vocabulary in the repository instead of three. Ignored when
          `tags` is set explicitly. Off by default: tags REPLACE, so enabling
          this hands curation in the TER UI over to the repository.
        required: false
        type: boolean
        default: false
      issues-url:
        description: Override for the "issues" URL in TER metadata. Defaults to ${repo}/issues.
        required: false
        type: string
        default: ''
      repository-url:
        description: Override for the "repository" URL in TER metadata. Defaults to the GitHub repo URL.
        required: false
        type: string
        default: ''
    secrets:
      TYPO3_EXTENSION_KEY:
        description: "Deprecated: extension key is auto-resolved from composer.json"
        required: false
      TYPO3_TER_ACCESS_TOKEN:
        required: true

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     publish:
#       uses: netresearch/typo3-ci-workflows/.github/workflows/publish-to-ter.yml@main
#       permissions:
#         contents: read
permissions: {}

jobs:
  publish:
    name: Publish to TER
    runs-on: ubuntu-latest
    # GitHub Actions expressions don't support arithmetic, so we can't
    # auto-derive `verify-timeout-minutes + buffer` here. Callers that
    # raise `verify-timeout-minutes` above the default must also raise
    # `job-timeout-minutes` to keep the verify loop from being cut
    # short by the job budget.
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Resolve version
        id: version
        env:
          GIT_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Extract version from ext_emconf.php (single source of truth)
          if [[ ! -f ext_emconf.php ]]; then
            echo "::error::ext_emconf.php not found"
            exit 1
          fi
          VERSION=$(sed -nE "s/.*'version'[[:space:]]*=>[[:space:]]*'([^']+)'.*/\1/p" ext_emconf.php)
          if [[ -z "$VERSION" ]]; then
            echo "::error file=ext_emconf.php::Could not extract version"
            exit 1
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format in ext_emconf.php: $VERSION"
            exit 1
          fi

          # When triggered by tag push, validate tag matches ext_emconf.php
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            TAG="${GIT_REF#refs/tags/}"
            TAG_VERSION="${TAG#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::Tag version ($TAG_VERSION) does not match ext_emconf.php ($VERSION)"
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION (from tag $TAG)"
          else
            # Non-tag ref: runs for any caller that didn't dispatch against
            # a git tag. The most common case is a workflow_dispatch-only
            # caller (the t3x-nr-llm / t3x-nr-mcp-agent pattern) where
            # GitHub rejects `--ref <tag>` when the caller file doesn't
            # exist at that tag, forcing callers onto a branch ref instead.
            # But this branch also runs if a caller chooses to invoke the
            # reusable workflow on a branch push, schedule, or
            # pull_request event. In all cases the release tag cannot be
            # derived from $GIT_REF, so we resolve it from the
            # ext_emconf.php version instead -- so the "Get release
            # comment" step downstream can still fetch the GitHub release
            # body as the TER upload comment. Try 'v${VERSION}' first
            # (signed-tag convention), fall back to bare '${VERSION}'
            # (historic).
            TAG=""
            if gh release view "v${VERSION}" --json tagName --jq .tagName >/dev/null 2>&1; then
              TAG="v${VERSION}"
            elif gh release view "${VERSION}" --json tagName --jq .tagName >/dev/null 2>&1; then
              TAG="${VERSION}"
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            if [[ -n "$TAG" ]]; then
              echo "Version $VERSION (non-tag ref, derived release tag: $TAG)"
            else
              echo "::warning::No GitHub release found for version $VERSION (tried 'v$VERSION' and '$VERSION') -- TER upload comment will be the default short link"
              echo "Version $VERSION (non-tag ref, no matching release tag)"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Install tailor
        run: composer global require typo3/tailor:^1 --prefer-dist --no-progress

      - name: Resolve extension key from composer.json
        id: extkey
        run: |
          KEY=$(php -r "echo json_decode(file_get_contents('composer.json'), true)['extra']['typo3/cms']['extension-key'] ?? '';")
          if [[ -z "$KEY" ]]; then
            echo "::error file=composer.json::Missing extension-key in extra.typo3/cms"
            exit 1
          fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Extension key: $KEY"

      - name: Get release comment
        id: comment
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release-notes }}
        run: |
          COMMENT=""

          # 0. Prefer the CHANGELOG section for this version. It is curated,
          # committed, and present at the tagged commit — unlike the GitHub
          # release body, which does not exist yet on a tag-triggered release,
          # and unlike the generated notes, which are just "Initial release" for
          # a first release. Absent file or absent section yields nothing and
          # falls through.
          if [[ -f CHANGELOG.md ]]; then
            COMMENT=$(python3 - "$VERSION" CHANGELOG.md <<'PY'
          import re, sys
          version, path = sys.argv[1], sys.argv[2]
          try:
              text = open(path, encoding='utf-8').read()
          except OSError:
              sys.exit(0)
          # Matches "## [1.2.3] - 2026-01-01", "## 1.2.3" and "## v1.2.3".
          heading = re.compile(r'^##\s+\[?v?' + re.escape(version) + r'\]?.*$', re.M)
          found = heading.search(text)
          if not found:
              sys.exit(0)
          rest = text[found.end():]
          following = re.search(r'^##\s+', rest, re.M)
          section = (rest[:following.start()] if following else rest).strip()
          sys.stdout.write(section[:1900])
          PY
            )
          fi

          # 1. Otherwise use notes handed over by the caller. The
          # release-typo3-extension pipeline creates the GitHub release *after*
          # this job, so the lookup below cannot find a body during a normal
          # tag-triggered release and every upload would fall through to the
          # bare link. Callers that already generated the notes pass them in.
          if [[ -z "${COMMENT// }" ]] && [[ -n "${RELEASE_NOTES// }" ]]; then
            COMMENT=$(
              printf '%s' "$RELEASE_NOTES" \
                | python3 -c 'import sys; sys.stdout.write(sys.stdin.read()[:1900])'
            )
          fi

          # 2. Otherwise read the GitHub release body (curated, may cover
          # multiple versions). Applies when the release already exists, e.g. a
          # re-publish or a caller that publishes to TER after creating it.
          if [[ -z "${COMMENT// }" ]] && [[ -n "$TAG" ]]; then
            RELEASE_BODY=$(gh release view "$TAG" --json body --jq '.body' 2>/dev/null || true)
            if [[ -n "${RELEASE_BODY// }" ]]; then
              # Strip HTML tags and limit length for TER (max ~2000 chars).
              # Truncation is CHARACTER-based, not byte-based: `head -c`
              # splits multi-byte UTF-8 sequences (emoji, em-dashes,
              # accented characters) mid-codepoint and TER rejects the
              # resulting invalid UTF-8. Use python3 with explicit UTF-8
              # decoding: guaranteed-stable slicing on codepoints,
              # doesn't depend on whether the runner's `awk` is gawk or
              # mawk (ubuntu-latest historically ships both), doesn't
              # fold blank lines (no RS="" paragraph mode), and preserves
              # leading/trailing whitespace verbatim.
              #
              # `printf '%s'` (not `echo`) so that release bodies starting
              # with `-n` / `-e` / `--` are passed through literally
              # rather than interpreted as echo's own options.
              COMMENT=$(
                printf '%s' "$RELEASE_BODY" \
                  | sed 's/<[^>]*>//g' \
                  | python3 -c 'import sys; sys.stdout.write(sys.stdin.read()[:1900])'
              )
            fi
          fi

          # 2. Fall back to commit log since previous tag
          if [[ -z "${COMMENT// }" ]] && [[ -n "$TAG" ]]; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [[ -n "$PREVIOUS_TAG" ]]; then
              LOG=$(git log --pretty=format:"- %s" "${PREVIOUS_TAG}..HEAD" -- 2>/dev/null || true)
            fi
            # Fall back to tag annotation
            if [[ -z "${LOG// }" ]]; then
              LOG=$(git tag -n10 -l "$TAG" | sed "s/^[0-9v.]*[ ]*//" || true)
            fi
            if [[ -n "${LOG// }" ]]; then
              # Same character-level truncation as the release-body branch
              # above — git log / tag annotations can also exceed TER's
              # ~2000 char limit and the final comment must fit regardless
              # of source.
              COMMENT=$(
                printf '%s' "$LOG" \
                  | python3 -c 'import sys; sys.stdout.write(sys.stdin.read()[:1900])'
              )
            fi
          fi

          # 5. Render for TER. The comment is stored as plain text: TER escapes
          # HTML and turns newlines into <br>, so Markdown markers show up
          # verbatim and hard-wrapped source arrives as ragged short lines.
          # Carry the structure over with characters that survive that, and
          # drop the markers that do not. No Unicode "bold" — those code points
          # read badly in screen readers and break find-in-page.
          if [[ -n "${COMMENT// }" ]]; then
            COMMENT=$(COMMENT_RAW="$COMMENT" python3 <<'PY'
          import os, re, sys

          def inline(value):
              value = re.sub(r'`([^`]+)`', r'\1', value)
              value = re.sub(r'\[([^\]]+)\]\(([^)\s]+)\)', r'\1 (\2)', value)
              value = re.sub(r'<(https?://[^>\s]+)>', r'\1', value)
              value = re.sub(r'\*\*([^*]+)\*\*', r'\1', value)
              value = re.sub(r'(?<![A-Za-z0-9_])_([^_]+)_(?![A-Za-z0-9_])', r'\1', value)
              value = re.sub(r'(?<!\*)\*([^*]+)\*(?!\*)', r'\1', value)
              return value

          lines, buffer = [], ''

          def flush():
              global buffer
              if buffer:
                  lines.append(inline(buffer))
                  buffer = ''

          for raw in os.environ['COMMENT_RAW'].splitlines():
              text = raw.strip()
              bullet = re.match(r'^[-*+]\s+(.*)$', text)
              if not text:
                  flush()
                  lines.append('')
              elif text.startswith('#'):
                  flush()
                  lines.append(inline(re.sub(r'^#+\s*', '', text)).rstrip(':') + ':')
              elif bullet:
                  flush()
                  buffer = '• ' + bullet.group(1)
              elif re.match(r'^\d+\.\s', text):
                  flush()
                  buffer = text
              else:
                  buffer = f'{buffer} {text}'.strip()
          flush()

          result = re.sub(r'\n{3,}', '\n\n', '\n'.join(lines)).strip()
          sys.stdout.write(result[:1900])
          PY
            )
          fi

          # 6. Append link to GitHub releases
          if [[ -n "${COMMENT// }" ]]; then
            COMMENT="${COMMENT}

          For details see $SERVER_URL/$REPO/releases"
          else
            COMMENT="Released version $VERSION -- for details see $SERVER_URL/$REPO/releases"
          fi

          DELIMITER="ghadelim_$(openssl rand -hex 8)"
          {
            echo "comment<<$DELIMITER"
            echo "$COMMENT"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Check if version is already on TER
        id: precheck
        env:
          KEY: ${{ steps.extkey.outputs.key }}
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force-republish }}
        run: |
          # HEAD the download URL: 200 => version already published, skip.
          # This makes the workflow idempotent so republishing a tag after a
          # partial failure is a safe no-op on the TER side.
          #
          # force-republish overrides that. Refreshing the upload comment of a
          # published version requires re-uploading it, so the guard would
          # otherwise make the documented comment-repair procedure a no-op.
          if [[ "$FORCE" == "true" ]]; then
            echo "already-published=false" >> "$GITHUB_OUTPUT"
            echo "force-republish requested — uploading $VERSION regardless of TER state"
            exit 0
          fi
          URL="https://extensions.typo3.org/extension/download/${KEY}/${VERSION}/zip"
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -I --max-time 15 "$URL" || echo "000")
          if [[ "$STATUS" == "200" ]]; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is already on TER — skipping publish"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
            echo "TER precheck status for $VERSION: $STATUS (will publish)"
          fi

      - name: Publish to TER
        if: steps.precheck.outputs.already-published != 'true'
        env:
          TYPO3_EXTENSION_KEY: ${{ steps.extkey.outputs.key }}
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMENT: ${{ steps.comment.outputs.comment }}
        run: php ~/.composer/vendor/bin/tailor ter:publish --comment="$COMMENT" "$VERSION"

      - name: Verify TER serves the version
        env:
          KEY: ${{ steps.extkey.outputs.key }}
          VERSION: ${{ steps.version.outputs.version }}
          TIMEOUT_MINUTES: ${{ inputs.verify-timeout-minutes }}
          POLL_INTERVAL: ${{ inputs.verify-poll-interval-seconds }}
        run: |
          URL="https://extensions.typo3.org/extension/download/${KEY}/${VERSION}/zip"
          DEADLINE=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          ATTEMPT=0
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -I --max-time 15 "$URL" || echo "000")
            if [[ "$STATUS" == "200" ]]; then
              echo "TER serves $VERSION (attempt $ATTEMPT)"
              exit 0
            fi
            if [[ $(date +%s) -ge $DEADLINE ]]; then
              echo "::error::Timed out waiting for TER to serve $VERSION (last status: $STATUS)"
              exit 1
            fi
            echo "Attempt $ATTEMPT: status $STATUS, retrying in ${POLL_INTERVAL}s"
            sleep "$POLL_INTERVAL"
          done

      - name: Update TER metadata
        # Keeps the TER listing's Manual / Issues / Repository links current.
        # Idempotent — TER overwrites with the supplied values on every call.
        # Runs regardless of the idempotency precheck: even when the version
        # was already on TER, the metadata may have drifted (e.g. repo
        # renamed) and this step reconciles it.
        if: inputs.update-metadata
        env:
          KEY: ${{ steps.extkey.outputs.key }}
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          MANUAL_INPUT: ${{ inputs.manual-url }}
          TAGS_INPUT: ${{ inputs.tags }}
          DERIVE_TAGS: ${{ inputs.derive-tags-from-composer }}
          ISSUES_INPUT: ${{ inputs.issues-url }}
          REPOSITORY_INPUT: ${{ inputs.repository-url }}
        run: |
          # Composer name is kept in sync with the local composer.json rather
          # than plumbed as a separate input — the source of truth is already
          # on the checked-out ref and will never disagree with what we just
          # published.
          COMPOSER_NAME=$(php -r "echo json_decode(file_get_contents('composer.json'), true)['name'] ?? '';")
          if [[ -z "$COMPOSER_NAME" ]]; then
            echo "::error file=composer.json::Missing 'name' field — required for TER metadata update"
            exit 1
          fi

          REPO_URL="${SERVER_URL}/${REPO}"
          ISSUES_URL="${ISSUES_INPUT:-${REPO_URL}/issues}"
          REPOSITORY_URL="${REPOSITORY_INPUT:-$REPO_URL}"

          # Build the tailor argv in an array. --manual is appended ONLY
          # when manual-url is explicitly set -- empty means "preserve
          # TER's existing value" so composer-docs auto-publish consumers
          # keep their docs.typo3.org/p/... auto-link intact.
          TAILOR_ARGS=(
            "--composer=$COMPOSER_NAME"
            "--issues=$ISSUES_URL"
            "--repository=$REPOSITORY_URL"
          )

          echo "Updating TER metadata for $KEY:"
          echo "  composer=$COMPOSER_NAME"
          if [[ -n "$MANUAL_INPUT" ]]; then
            TAILOR_ARGS+=("--manual=$MANUAL_INPUT")
            echo "  manual=$MANUAL_INPUT"
          else
            echo "  manual=(preserving TER's existing value)"
          fi
          # A TER listing is a TYPO3 extension by definition, so platform terms
          # carry no information there — unlike on GitHub, where they are what
          # makes a repository findable at all. Derive from the one vocabulary
          # in the repository and report what was dropped rather than filtering
          # silently.
          if [[ -z "$TAGS_INPUT" && "$DERIVE_TAGS" == "true" ]]; then
            TAGS_INPUT=$(python3 <<'PY'
          import json, sys

          IMPLIED_BY_TER = {
              'typo3', 'typo3-cms', 'typo3cms', 'typo3-extension', 'typo3ext',
              'extension', 'extensions', 'cms', 'php', 'ter',
          }
          try:
              keywords = json.load(open('composer.json', encoding='utf-8')).get('keywords', [])
          except (OSError, ValueError):
              sys.exit(0)

          kept, dropped = [], []
          for keyword in keywords:
              value = str(keyword).strip()
              if not value:
                  continue
              (dropped if value.lower() in IMPLIED_BY_TER else kept).append(value)

          if dropped:
              print(f"  dropped as implied by TER: {', '.join(dropped)}", file=sys.stderr)
          if not kept:
              print('  composer.json keywords yielded no TER-specific tag', file=sys.stderr)
          sys.stdout.write(','.join(kept))
          PY
            )
          fi
          # Omitted unless set: tailor sends only non-null options, and TER
          # replaces the entire tag list with whatever arrives.
          if [[ -n "$TAGS_INPUT" ]]; then
            TAILOR_ARGS+=("--tags=$TAGS_INPUT")
            echo "  tags=$TAGS_INPUT"
          else
            echo "  tags=(preserving TER's existing value)"
          fi
          echo "  issues=$ISSUES_URL"
          echo "  repository=$REPOSITORY_URL"

          php ~/.composer/vendor/bin/tailor ter:update "${TAILOR_ARGS[@]}" "$KEY"
