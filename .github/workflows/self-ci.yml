name: Self-CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Composer aborts on the first transient network failure: its CurlDownloader
# retries curl errno 6/7/16/28/92 (and 35/56 on "Connection reset by peer")
# and throws on everything else, so an intermittent TLS abort against
# api.github.com — errno 60, seen across several repositories — kills the job
# and only a re-run clears it, which is also how a real regression gets waved
# through. `composer_retry` retries up to three times, but only when the
# failure output actually names a transport error; a dependency-resolution
# failure still fails on the first attempt.
env:
  COMPOSER_RETRY: |
    composer_retry() {
      local attempt status log
      log=$(mktemp)
      for attempt in 1 2 3; do
        set +e
        composer "$@" 2>&1 | tee "$log"
        status=${PIPESTATUS[0]}
        set -e
        if [[ "$status" == 0 ]]; then
          rm -f "$log"
          return 0
        fi
        if ! grep -qiE 'curl error|failed to download|could not be downloaded|could not fetch|could not resolve host|ssl certificate problem|operation timed out|connection reset' "$log"; then
          rm -f "$log"
          echo "::error::composer $* failed (exit $status) with no transport error in its output; not retried"
          return "$status"
        fi
        if [[ "$attempt" == 3 ]]; then
          rm -f "$log"
          echo "::error::composer $* failed on all 3 attempts (exit $status)"
          return "$status"
        fi
        echo "::warning::composer $* hit a network error (exit $status, attempt $attempt/3); retrying"
        sleep $((attempt * 5))
      done
    }

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          # --retry, because this download failing takes the whole lint job with
          # it: on 2026-08-21 the step failed while `Run actionlint` never ran,
          # which reads as a lint finding on the pull request and is not one.
          # Same class as #169. --fail so an HTTP error is not written to disk
          # and diagnosed later as a checksum mismatch.
          # --proto/--proto-redir: -L follows redirects, and without this a redirect
          # to http would be followed too. SonarCloud flagged exactly that on
          # this line.
          curl --retry 3 --retry-delay 2 --retry-all-errors --fail --proto '=https' --proto-redir '=https' -sLO "https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz"
          echo "900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a  actionlint_1.7.11_linux_amd64.tar.gz" | sha256sum -c
          tar xzf actionlint_1.7.11_linux_amd64.tar.gz actionlint

      - name: Run actionlint
        run: ./actionlint -color

  lint-php:
    name: Lint PHP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-self-ci-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-self-ci-

      - name: Install dependencies
        run: |
          eval "$COMPOSER_RETRY"
          composer_retry install --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          FILE_COUNT=$(find config/ src/ Build/ -name '*.php' | wc -l)
          echo "Linting $FILE_COUNT PHP files..."
          find config/ src/ Build/ -name '*.php' -print0 | xargs -0 -P"$(nproc)" -n1 php -l

      - name: Smoke test php-cs-fixer config factory
        run: |
          cat > /tmp/smoke-cgl.php << 'PHPEOF'
          <?php
          require_once 'vendor/autoload.php';
          $factory = require "config/php-cs-fixer/config.php";
          $tmpDir = sys_get_temp_dir() . "/self-ci-cgl-" . uniqid();
          mkdir($tmpDir);
          file_put_contents($tmpDir . "/test.php", "<?php\n");
          $config = $factory("Test header", $tmpDir);
          if (!$config instanceof PhpCsFixer\Config) {
              fwrite(STDERR, "Factory must return PhpCsFixer\\Config" . PHP_EOL);
              exit(1);
          }
          echo "php-cs-fixer config factory: OK" . PHP_EOL;
          PHPEOF
          php -dzend.assertions=1 /tmp/smoke-cgl.php

      - name: Check the method-chain fixer
        # The fixer is registered by the shared config factory, so a defect in
        # it reaches every consumer that opts in. Fixtures, no container: input,
        # expected output, idempotence, and the structural property whose
        # violation once made `statement_indentation` die on the result.
        run: php -dzend.assertions=1 Build/Scripts/check-break-long-method-chain.php

      - name: Smoke test rector config factory
        run: |
          cat > /tmp/smoke-rector.php << 'PHPEOF'
          <?php
          require_once 'vendor/autoload.php';
          $configure = require "config/rector/rector.php";
          if (!is_callable($configure)) {
              fwrite(STDERR, "Rector config must return a callable" . PHP_EOL);
              exit(1);
          }
          echo "rector config factory: OK" . PHP_EOL;
          PHPEOF
          php -dzend.assertions=1 /tmp/smoke-rector.php

      - name: Smoke test rector boots with the shared config
        run: |
          FIXTURE=$(mktemp -d)
          mkdir -p "$FIXTURE/Classes" "$FIXTURE/Configuration"
          printf '<?php\n\ndeclare(strict_types=1);\n\nfinal class SmokeFixture\n{\n    public function noop(): void\n    {\n    }\n}\n' > "$FIXTURE/Classes/SmokeFixture.php"
          printf '<?php\n\nreturn [];\n' > "$FIXTURE/Configuration/Services.php"
          # Content is irrelevant; the file only has to exist so that the neon's
          # %currentWorkingDirectory%/ext_emconf.php exclude resolves.
          printf '<?php\n' > "$FIXTURE/ext_emconf.php"
          cat > "$FIXTURE/rector.php" << 'PHPEOF'
          <?php

          declare(strict_types=1);

          use Rector\Config\RectorConfig;
          use Ssch\TYPO3Rector\Set\Typo3SetList;

          $configure = require getenv('SHARED_RECTOR_CONFIG');

          return static function (RectorConfig $rectorConfig) use ($configure): void {
              $configure($rectorConfig, getenv('FIXTURE_ROOT'));

              // A TYPO3 set is what pulls in ssch/typo3-rector's own config file.
              // Without one the boot never reaches it, and an incompatibility
              // between that file and rector/rector stays invisible here while
              // breaking every consumer.
              $rectorConfig->sets([Typo3SetList::GENERAL]);
          };
          PHPEOF
          REPO="$PWD"
          export SHARED_RECTOR_CONFIG="$REPO/config/rector/rector.php"
          export FIXTURE_ROOT="$FIXTURE"
          STATUS=0
          # Run from the fixture: phpstan-rector.neon excludes
          # %currentWorkingDirectory%/ext_emconf.php, which must resolve.
          (cd "$FIXTURE" && "$REPO/vendor/bin/rector" process --dry-run --config "$FIXTURE/rector.php") > "$FIXTURE/out.log" 2>&1 || STATUS=$?
          tail -20 "$FIXTURE/out.log"
          # 0 = nothing to change, 2 = the dry run found changes in the fixture.
          # Everything else — 1 for a Rector error, 127 for a missing binary, a
          # signal — is a failure to boot and must not pass silently.
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 2 ]; then
            echo "Rector failed to boot with the shared config (exit $STATUS)" >&2
            exit 1
          fi
          if grep -q '\[ERROR\]' "$FIXTURE/out.log"; then
            echo "Rector reported an error with the shared config" >&2
            exit 1
          fi
          echo "rector boot smoke test: OK"

  lint-json:
    name: Lint JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Validate JSON files
        run: |
          set -euo pipefail
          STATUS=0
          for f in composer.json config/captainhook/captainhook.json renovate.json; do
            if [[ -f "$f" ]]; then
              if jq empty "$f" 2>/dev/null; then
                echo "OK: $f"
              else
                echo "FAIL: $f is not valid JSON"
                STATUS=1
              fi
            else
              echo "SKIP: $f not found"
            fi
          done
          exit "$STATUS"

      - name: Composer validate
        # Not --strict: this package EXISTS to pin the rule-generating tools
        # (rector/rector, ssch/typo3-rector) to exact versions, and --strict
        # promotes composer's "exact version constraints should be avoided"
        # warning to a failure. Schema violations still fail without --strict.
        run: composer validate

  lint-shell:
    name: Lint Shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck on scripts
        run: |
          set -euo pipefail
          shellcheck --severity=warning scripts/migrate-to-grouped-callers.sh
          # The shipped runner and its bootstrap are what every extension
          # executes, so they are gated here rather than only where they land.
          # The runner is checked at `error`: it descends from TYPO3 Core's
          # runTests.sh, whose whole style is deliberate word splitting
          # (${CONTAINER_COMMON_PARAMS} must become several docker arguments),
          # so `warning` reports 23 findings that must not be "fixed". The
          # stub is our own and is clean at the default severity.
          shellcheck -x --severity=error assets/Build/Scripts/runTests.sh
          shellcheck -x assets/Build/Scripts/runTests.stub.sh
          shellcheck -x Build/Scripts/check-runner-variables.sh
          shellcheck -x Build/Scripts/check-runner-detection.sh
          shellcheck -x Build/Scripts/check-empty-suite-fails.sh
          shellcheck -x Build/Scripts/check-e2e-provision-config.sh
          shellcheck -x --severity=error assets/Build/Scripts/e2e-provision.sh

      - name: Check the runner defines what it uses
        # v1.7.0 shipped with IMAGE_PLAYWRIGHT referenced and never assigned,
        # so `-s e2e` ran `docker run … ""` in every consumer. The file parsed,
        # shellcheck was clean, and no job here ran a suite. This closes that
        # gap without needing a container.
        run: bash Build/Scripts/check-runner-variables.sh assets/Build/Scripts/runTests.sh

      - name: Check what the runner derives from a project
        # The companion to the step above: that one asks whether a variable has
        # a value, this one whether the value is read out of the right file.
        # Fixture extensions, no container, no PHP.
        run: bash Build/Scripts/check-runner-detection.sh assets/Build/Scripts/runTests.sh

      - name: Check that provisioning's TYPO3 config takes effect
        # additional.php shipped as a file that RETURNS an array, and TYPO3
        # discards that: it requires the file for its side effects
        # (ConfigurationManager::exportConfiguration()). Every debug setting in
        # it was inert, including the exception handlers, and the file parses
        # either way — so this runs it and looks at $GLOBALS (#229).
        run: bash Build/Scripts/check-e2e-provision-config.sh assets/Build/Scripts/e2e-provision.sh

      - name: Check that a suite with nothing to run fails
        # The fallback chain used to end in a notice and a green job, which is
        # coverage that does not exist (#188). This runs the four steps' own
        # bash with an empty script list and asserts a non-zero exit, rather
        # than grepping for `exit 1` — text can sit in a branch nothing reaches.
        run: bash Build/Scripts/check-empty-suite-fails.sh .github/workflows/ci.yml

      - name: Check that no testsuite name is hardcoded in a workflow
        # extended-testing.yml carried `--testsuite="Unit Tests"` in seven
        # places, which is one extension's spelling written into a shared
        # workflow (#190). t3x-nr-vault built its own gate rather than adopt
        # them, and said so in a comment.
        run: |
          set -euo pipefail
          STATUS=0
          for wf in .github/workflows/*.yml; do
            hits=$(yq -o json '.jobs' "$wf" 2>/dev/null \
              | jq -r '[.. | strings | select(test("--testsuite=\"[A-Za-z]"))] | length' 2>/dev/null || echo 0)
            if [ "${hits:-0}" -gt 0 ]; then
              echo "::error::$wf hardcodes $hits testsuite name(s); take them from an input"
              STATUS=1
            fi
          done
          [ "$STATUS" -eq 0 ] && echo "no hardcoded testsuite names"
          exit "$STATUS"

      - name: Check that the fuzz preflight survives a config without a fuzz suite
        # This is the case that broke: grep finds nothing, `set -o pipefail`
        # carries its exit 1 out of the command substitution, `set -e` kills the
        # step, and `All security checks` needs that job. Every consumer with a
        # phpunit config and no fuzz suite was affected.
        #
        # The check RUNS the block and asserts the exit code. The guard that
        # missed this ran it too — and only looked at the output file, which is
        # empty both when the answer is "no suite" and when the step died.
        run: |
          set -euo pipefail
          block=$(yq -r '.jobs.preflight.steps[] | select(.id == "detect") | .run' .github/workflows/fuzz.yml)
          work=$(mktemp -d)
          printf '<phpunit><testsuites><testsuite name="unit"><directory>../Tests/Unit</directory></testsuite></testsuites></phpunit>\n' > "$work/phpunit.xml"
          printf '<phpunit><testsuites><testsuite name="fuzzy"><directory>../Tests/Fuzz</directory></testsuite></testsuites></phpunit>\n' > "$work/withfuzz.xml"
          STATUS=0

          out=$(mktemp)
          if ( cd "$work" && PHPUNIT_CONFIG=phpunit.xml FUZZ_SUITE=Fuzz GITHUB_OUTPUT="$out" bash -c "$block" ); then
            if grep -qx 'has-fuzz=false' "$out"; then
              echo "no fuzz suite: exit 0 and has-fuzz=false"
            else
              echo "::error::no fuzz suite: exit 0 but output was '$(cat "$out")'"; STATUS=1
            fi
          else
            echo "::error::no fuzz suite: the block exited non-zero — this fails the required gate"; STATUS=1
          fi

          out=$(mktemp)
          if ( cd "$work" && PHPUNIT_CONFIG=withfuzz.xml FUZZ_SUITE=Fuzz GITHUB_OUTPUT="$out" bash -c "$block" ); then
            if grep -qx 'fuzz-suite=fuzzy' "$out"; then
              echo "fuzzy suite: detected under its own name"
            else
              echo "::error::fuzzy suite: expected fuzz-suite=fuzzy, got '$(cat "$out")'"; STATUS=1
            fi
          else
            echo "::error::fuzzy suite: the block exited non-zero"; STATUS=1
          fi
          exit "$STATUS"

      - name: Check that the fuzz job selects the suite it detected
        # Detecting case-insensitively while selecting with the configured
        # spelling ran phpunit against a suite that does not exist — "No tests
        # executed", exit 1. Three of the four repositories with fuzz tests
        # spell the suite differently from the default, so this was not an edge
        # case.
        run: |
          set -euo pipefail
          run_env=$(yq -o json '.jobs["fuzz-tests"].steps[] | select(.name == "Run Fuzz Tests") | .env.FUZZ_SUITE' .github/workflows/fuzz.yml)
          case "$run_env" in
            *preflight.outputs.fuzz-suite*)
              echo "fuzz job uses the detected suite name" ;;
            *)
              echo "::error::the fuzz job selects ${run_env} instead of the name preflight detected"
              exit 1 ;;
          esac

      - name: Validate repo config files
        run: |
          set -euo pipefail
          STATUS=0
          for conf in scripts/repo-configs/*.conf; do
            echo "Checking $conf..."
            if bash -n "$conf" 2>&1; then
              echo "  OK"
            else
              echo "  FAIL: syntax error"
              STATUS=1
            fi
          done
          exit "$STATUS"

  check-action-pins:
    name: Check Action Pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify all actions use SHA pins
        run: |
          set -euo pipefail
          STATUS=0

          while IFS= read -r -d '' file; do
            # Match only YAML uses: keys (not comments or run: script content)
            while IFS= read -r line; do
              # Extract the action reference
              ref=$(echo "$line" | sed -n 's/.*uses:\s*//p' | xargs)

              # Skip local references (./)
              [[ "$ref" == ./* ]] && continue

              # Skip first-party Netresearch reusable workflows: by policy
              # they track @main and are never SHA-pinned (third-party
              # actions still require a full SHA pin below).
              [[ "$ref" == netresearch/* ]] && continue

              # Skip docker:// references pinned by digest (@sha256:...)
              [[ "$ref" == docker://*@sha256:* ]] && continue

              # Require full SHA pin: @<40+ hex chars>
              if ! echo "$ref" | grep -qE '@[0-9a-f]{40}'; then
                echo "FAIL: $file: $ref"
                STATUS=1
              fi
            done < <(grep -E '^\s*-?\s*uses:' "$file" || true)
          done < <(find .github/workflows -name '*.yml' -print0)

          if [[ "$STATUS" -eq 0 ]]; then
            echo "All actions are SHA-pinned."
          else
            echo ""
            echo "ERROR: Found actions using floating tags instead of SHA pins."
            echo "Pin actions to full commit SHAs (e.g., uses: actions/checkout@<sha> # v6.0.2)"
            exit 1
          fi

  zizmor:
    name: zizmor
    permissions:
      contents: read
      security-events: write
    uses: netresearch/.github/.github/workflows/zizmor.yml@main
