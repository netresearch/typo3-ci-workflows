name: Verify docs.typo3.org rendering

# Doesn't trigger the render — docs.typo3.org's Intercept webhook auto-triggers
# when GitHub fires a push/tag event on a repo registered in TER. This
# workflow polls the public render workflow in `TYPO3-Documentation/t3docs-ci-deploy`
# for the job whose name matches the caller's package, then reports its
# success/failure.
#
# WHAT THIS ASSERTS, AND WHAT IT DOES NOT
# =======================================
# It asserts that the render job reached Intercept: a run for this package
# exists in the render workflow. It does NOT wait for that run to finish, and
# it never fails the caller.
#
# Both halves are deliberate. The render queue is shared by the whole TYPO3
# ecosystem, so how long a render takes — and whether ours is still inside the
# window this search can see — depends on what everyone else is publishing at
# that minute, not on the release being verified. Waiting for the outcome made
# a green release run a function of ecosystem load: two attempts at one release
# both failed here while the documentation rendered correctly and is live.
#
# A release must not be marked failed by that, which is why the orchestrator
# already keeps this job out of the gate for TER, Packagist and the GitHub
# release. Reporting it as a failed job did the same damage one level up: the
# run went red for something that had not gone wrong.
#
# Polling the render workflow rather than the rendered URL is still the right
# probe for the dispatch question: Intercept maps tags to major.minor docs
# branches (v0.8.1 → 0.8), so the rendered URL pattern depends on conventions
# the caller shouldn't need to reconstruct, and the matched run URL is evidence
# the release body can cite.
#
# The outcome is exposed as the `dispatched` output so the caller can word its
# release notes truthfully — "accepted by Intercept" is not "render verified",
# and this workflow no longer knows the second.

on:
  workflow_call:
    inputs:
      package-name:
        description: |
          Composer-style vendor/name used by t3docs-ci-deploy to name the
          render job (e.g. "netresearch/nr-passkeys-be"). Must match the
          job literally — the render job is named "Render {package-name}".
        required: true
        type: string
      since:
        description: |
          ISO-8601 timestamp; only render runs created on or after this moment
          are considered. If omitted, the workflow falls back to a timestamp
          approximately 5 minutes in the past to locate the matching render
          run (covers the typical Intercept dispatch delay when the
          orchestrator calls us right after the tag push).
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: |
          Job-level timeout. Only a backstop since the search gave up waiting
          for the render to finish — `intercept-grace-seconds` is what bounds
          the search itself.
        required: false
        type: number
        default: 45
      poll-interval-seconds:
        description: Seconds between polls of the render workflow
        required: false
        type: number
        default: 30
      intercept-grace-seconds:
        description: Seconds to wait for Intercept to create the render run before giving up on the search
        required: false
        type: number
        default: 180
    outputs:
      dispatched:
        description: |
          "true" when a render run for this package was found, i.e. Intercept
          accepted the job. "false" when none appeared within
          `intercept-grace-seconds` — which is not evidence that the render
          failed, only that it was not visible yet.
        value: ${{ jobs.verify.outputs.dispatched }}

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     verify:
#       uses: netresearch/typo3-ci-workflows/.github/workflows/publish-to-docs.yml@main
#       permissions:
#         contents: read
permissions: {}

jobs:
  verify:
    name: Verify docs render
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      dispatched: ${{ steps.search.outputs.dispatched }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Look for the render run Intercept created
        id: search
        env:
          PACKAGE: ${{ inputs.package-name }}
          SINCE_INPUT: ${{ inputs.since }}
          POLL_INTERVAL: ${{ inputs.poll-interval-seconds }}
          GRACE_SECONDS: ${{ inputs.intercept-grace-seconds }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          JOB_NAME="Render ${PACKAGE}"
          SINCE="${SINCE_INPUT:-$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)}"
          GRACE_DEADLINE=$(( $(date +%s) + GRACE_SECONDS ))
          RUN_ID=""
          # Track whether any jobs query has succeeded so far. If the
          # grace window expires with zero successful jobs queries, the
          # problem is the API (rate limit / auth), not Intercept —
          # report accordingly instead of misleading on the webhook.
          JOBS_QUERY_OK=false
          echo "Looking for render job named: $JOB_NAME"
          echo "Only considering runs created on or after: $SINCE"

          # Phase 1: wait for Intercept to create a render run for our package.
          while [[ -z "$RUN_ID" ]]; do
            # Fetch the most recent render-workflow runs (default page is 30);
            # that window is large enough to contain our run across all
            # typical Intercept dispatch delays without paginating.
            # Surface gh api errors instead of swallowing them — a transient
            # auth/rate-limit failure shouldn't be misreported as
            # "Intercept didn't fire". Capture stderr so the error message
            # lands in the workflow log.
            if ! RUNS_JSON=$(gh api \
              "repos/TYPO3-Documentation/t3docs-ci-deploy/actions/workflows/main-rendering.yml/runs?per_page=30" \
              --jq '.workflow_runs' 2>&1); then
              # Also a warning, for the same reason as the grace expiry below:
              # this is a statement about a GitHub API call, not about the
              # release being published. Failing here would redden a run over
              # someone else's rate limit.
              echo "::warning::Failed to list render workflow runs: ${RUNS_JSON}"
              echo "dispatched=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # For each run, ask the jobs endpoint whether our render job is
            # present. We cannot filter runs by inner-job-name server-side;
            # the request volume is still small (≤30) and short-circuits the
            # moment we find the run.
            while read -r CANDIDATE; do
              ID=$(echo "$CANDIDATE" | jq -r '.id')
              CREATED=$(echo "$CANDIDATE" | jq -r '.created_at')
              if [[ "$CREATED" < "$SINCE" ]]; then
                continue
              fi
              # Fetch jobs JSON, then run jq with --arg so JOB_NAME is safely
              # quoted (a `"` or other special character in package-name
              # would otherwise break the jq filter and silently miss the
              # match). Surface API errors instead of swallowing them.
              if ! JOBS_JSON=$(gh api \
                "repos/TYPO3-Documentation/t3docs-ci-deploy/actions/runs/${ID}/jobs" 2>&1); then
                echo "::warning::Failed to list jobs for run ${ID}: ${JOBS_JSON}"
                continue
              fi
              JOBS_QUERY_OK=true
              MATCH=$(echo "$JOBS_JSON" \
                | jq -r --arg job_name "$JOB_NAME" '.jobs[] | select(.name == $job_name) | .id' \
                | head -n 1 || true)
              if [[ -n "$MATCH" ]]; then
                RUN_ID="$ID"
                JOB_ID="$MATCH"
                echo "Matched render run: https://github.com/TYPO3-Documentation/t3docs-ci-deploy/actions/runs/${RUN_ID}"
                echo "Matched job id: ${JOB_ID}"
                break
              fi
            done < <(echo "$RUNS_JSON" | jq -c '.[]')

            if [[ -n "$RUN_ID" ]]; then
              break
            fi

            if [[ $(date +%s) -ge $GRACE_DEADLINE ]]; then
              # A warning, not an error, and the job still succeeds. Not
              # finding the run means it was not visible here within the
              # window — the render queue is shared by the whole ecosystem and
              # this search sees one page of it. That is not evidence the
              # render failed, so it must not colour a release run red.
              if [[ "$JOBS_QUERY_OK" != "true" ]]; then
                echo "::warning::Could not inspect any candidate run's jobs within ${GRACE_SECONDS}s — every jobs API query failed (likely auth or secondary rate limiting). This says nothing about Intercept; check the warnings above."
              else
                echo "::warning::No render run for '${JOB_NAME}' appeared within ${GRACE_SECONDS}s. Intercept may not have fired yet, or the run is outside the window this search covers. The render catches up on the next delivery."
              fi
              echo "dispatched=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No matching render run yet. Retrying in ${POLL_INTERVAL}s."
            sleep "$POLL_INTERVAL"
          done

          # Found: Intercept accepted the job. The render's own outcome is
          # deliberately not awaited — see the header. The run URL is the
          # evidence a release body can cite.
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Intercept accepted the render for ${PACKAGE} — https://github.com/TYPO3-Documentation/t3docs-ci-deploy/actions/runs/${RUN_ID}"
