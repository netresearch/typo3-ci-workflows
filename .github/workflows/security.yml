          # END pinned rule files
          FILES

          # A rule's id is the registry's: the file's directories, its name
          # in lower case, and the id inside the file, joined by dots.
          (cd "$TREE" && grep -v '^#' "${PINNED}/files.txt" \
            | xargs yq e -o json -I0 '{"file": filename, "rules": .rules}') > "${PINNED}/files.ndjson"
          jq -s '{rules: [.[]
              | (.file | sub("\\.ya?ml$"; "") | split("/")) as $p
              | (($p[:-1] + [$p[-1] | ascii_downcase]) | join(".")) as $prefix
              | .rules[] | .id = $prefix + "." + .id]}' \
            "${PINNED}/files.ndjson" > "${PINNED}/rules.yaml"

          count=$(jq '.rules | length' "${PINNED}/rules.yaml")
          digest=$(jq -r '.rules[].id' "${PINNED}/rules.yaml" | LC_ALL=C sort | sha256sum | cut -d ' ' -f 1)
          if [[ "$digest" != "$RULES_DIGEST" ]]; then
            echo "::error::The pinned rule files yield ${count} rules with id digest ${digest}, expected ${RULES_DIGEST}. Run Build/Scripts/refresh-opengrep-rules.sh."
            exit 1
          fi
          echo "::notice::Opengrep rule set: ${count} rules from semgrep-rules ${SEMGREP_RULES_SHA} and trailofbits/semgrep-rules ${TRAILOFBITS_RULES_SHA}"

      - name: Run Opengrep scan
        # Default config (--error --severity WARNING --severity ERROR) fails
        # this step on WARNING and ERROR findings: `--severity` selects exactly
        # the given level, so each gating level is named (#268). Findings of
        # an unselected level are also absent from the SARIF. The SARIF file
        # is still written on failure,
        # and the upload step below runs with if: always() so findings
        # land in the Security tab even when CI is blocked.
        #
        # `read -ra` tokenises OPENGREP_CONFIG on whitespace into an array
        # WITHOUT glob expansion or word-splitting surprises. Passing
        # "${ARGS[@]}" preserves each arg as a single argv entry, so
        # callers cannot inject shell syntax via this input.
        run: |
          # `read -r -a` tokenises OPENGREP_CONFIG on whitespace into an
          # array WITHOUT backslash interpretation or glob expansion, and
          # passing "${ARGS[@]}" preserves each arg as a single argv entry
          # so callers cannot inject shell syntax via this input.
          #
          # `|| :` absorbs the non-zero exit status `read` returns when
          # OPENGREP_CONFIG is an empty string (no delimiter consumed), so
          # a caller passing `opengrep-config: ''` doesn't abort the step
          # under GitHub Actions' default `bash -e` shell.
          ARGS=()
          read -r -a ARGS <<< "$OPENGREP_CONFIG" || :

          # `--config auto` (also `-c`/`-f`, or `--config=auto`) means the
          # rule set the step above pinned, not the registry's current one;
          # `--config p/default` still loads the registry's. The pinned
          # rules keep their registry ids (--no-rewrite-rule-ids), so
          # findings, code-scanning alerts and nosemgrep comments match
          # those of the registry rules.
          PINNED_RULES="${RUNNER_TEMP}/opengrep-pinned/rules.yaml"
          for (( i = 0; i < ${#ARGS[@]}; i++ )); do
            case "${ARGS[i]}" in
              --config | -c | -f)
                if [[ "${ARGS[i + 1]:-}" == auto ]]; then
                  ARGS[i + 1]="$PINNED_RULES"
                fi
                ;;
              --config=auto)
                ARGS[i]="--config=$PINNED_RULES"
                ;;
            esac
          done
          if [[ " ${ARGS[*]} " == *"$PINNED_RULES"* && ! -s "$PINNED_RULES" ]]; then
            echo "::error::--config auto needs the rule set of 'Fetch the pinned Opengrep rules', and ${PINNED_RULES} is missing"
            exit 1
          fi

          # The registry rule php.lang.security.exec-use.exec-use matches
          # any callee whose name STARTS with one of the sink names, in any
          # case, since semgrep/semgrep-rules#4081 made its regex
          # case-insensitive: `ExecutionIdentity::interactive()` and
          # `ExecuteTaskRequest::fromRequest()` fail the job. The scan
          # excludes that rule and runs the replacement below, whose regex
          # matches the whole callee name (an optional leading `\` for a
          # fully qualified call). The replacement is written for this
          # workflow: the registry rules are under the Semgrep Rules License
          # v1.0, which does not allow distributing them, so no rule text is
          # copied here. Its id differs from the registry id, which
          # `--exclude-rule` removes, and ends in it, so a
          # `nosemgrep: php.lang.security.exec-use.exec-use` comment keeps
          # suppressing it. Remove the rule file, `--exclude-rule` and the
          # second `--config` once the pinned registry rule anchors its
          # regex.
          RULES="${RUNNER_TEMP}/opengrep-rules"
          mkdir -p "$RULES"
          cat > "$RULES/exec-use.yaml" <<'YAML'
          rules:
            - id: netresearch.php.lang.security.exec-use.exec-use
              languages: [php]
              severity: ERROR
              message: >-
                $SINK() runs an operating-system command built from a
                non-literal value. Make sure no untrusted input can reach it.
              metadata:
                cwe:
                  - "CWE-78: OS Command Injection"
                category: security
                technology: [php]
                confidence: LOW
                source: netresearch/typo3-ci-workflows security.yml
              patterns:
                - pattern: $SINK(...);
                - pattern-not: $SINK("...", ...);
                - metavariable-regex:
                    metavariable: $SINK
                    regex: ^\\?(?i:exec|passthru|proc_open|popen|shell_exec|system|pcntl_exec)$
          YAML

          opengrep scan "${ARGS[@]}" \
            --no-rewrite-rule-ids \
            --exclude-rule php.lang.security.exec-use.exec-use \
            --config "$RULES/exec-use.yaml" \
            --sarif --output opengrep.sarif .

      - name: Drop nosemgrep-suppressed findings from the SARIF
        # Opengrep honours `nosemgrep` comments for its exit status — a file
        # whose only finding is suppressed exits 0 — but the SARIF it writes
        # still carries those results, flagged `suppressions: [{"kind":
        # "inSource"}]`. GitHub code scanning does not act on that flag, so a
        # finding a developer reviewed and documented in the source stays open
        # in the Security tab indefinitely, indistinguishable from one nobody
        # has looked at. Dropping them here makes the upload agree with the
        # gating that already happened.
        #
        # Writes to a second file and moves it into place only on success, so
        # a jq failure cannot leave a truncated SARIF behind.
        if: always() && hashFiles('opengrep.sarif') != ''
        run: |
          before=$(jq '[.runs[].results[]] | length' opengrep.sarif)
          jq '(.runs[].results) |= map(select((.suppressions // []) | length == 0))' \
            opengrep.sarif > opengrep.filtered.sarif
          after=$(jq '[.runs[].results[]] | length' opengrep.filtered.sarif)
          mv opengrep.filtered.sarif opengrep.sarif
          echo "::notice::Opengrep SARIF: $((before - after)) suppressed finding(s) dropped, ${after} uploaded"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: opengrep.sarif
          category: opengrep
