name: Security

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version for composer audit'
        required: false
        type: string
        default: '8.5'
      skip-composer-audit:
        description: 'Skip Composer dependency audit'
        required: false
        type: boolean
        default: false
      skip-opengrep:
        description: 'Skip Opengrep SAST scanning'
        required: false
        type: boolean
        default: false
      opengrep-config:
        description: 'Opengrep scan arguments (rules + behavior flags). `--severity` selects exactly one level and can be repeated; the default reports and fails CI on WARNING and ERROR findings (INFO is neither reported nor gating). Override to e.g. "--config auto" for report-only or "--config auto --error --severity ERROR" for gating on ERROR only.'
        required: false
        type: string
        default: '--config auto --error --severity WARNING --severity ERROR'

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     preflight:
#       uses: netresearch/typo3-ci-workflows/.github/workflows/security.yml@main
#       permissions:
#         contents: read
#         security-events: write
permissions: {}

# Composer aborts on the first transient network failure: its CurlDownloader
# retries curl errno 6/7/16/28/92 (and 35/56 on "Connection reset by peer")
# and throws on everything else, so an intermittent TLS abort against
# api.github.com — errno 60, seen across several repositories — kills the job
# and only a re-run clears it, which is also how a real regression gets waved
# through. `composer_retry` retries up to three times, but only when the
# failure output actually names a transport error; a dependency-resolution
# failure still fails on the first attempt.
env:
  COMPOSER_RETRY: |
    composer_retry() {
      local attempt status log
      log=$(mktemp)
      for attempt in 1 2 3; do
        set +e
        composer "$@" 2>&1 | tee "$log"
        status=${PIPESTATUS[0]}
        set -e
        if [[ "$status" == 0 ]]; then
          rm -f "$log"
          return 0
        fi
        if ! grep -qiE 'curl error|failed to download|could not be downloaded|could not fetch|could not resolve host|ssl certificate problem|operation timed out|connection reset' "$log"; then
          rm -f "$log"
          echo "::error::composer $* failed (exit $status) with no transport error in its output; not retried"
          return "$status"
        fi
        if [[ "$attempt" == 3 ]]; then
          rm -f "$log"
          echo "::error::composer $* failed on all 3 attempts (exit $status)"
          return "$status"
        fi
        echo "::warning::composer $* hit a network error (exit $status, attempt $attempt/3); retrying"
        sleep $((attempt * 5))
      done
    }

jobs:
  preflight:
    # Skip post-merge `push` runs whose SHA was already validated by a
    # successful `merge_group` run on the SAME workflow. The logic is
    # inlined (rather than a composite action) because cross-repo
    # reusable workflows cannot reference a same-repo composite action
    # via `./` syntax, and pinning a self-reference to a SHA creates a
    # chicken-and-egg between workflow change and SHA bump.
    name: Preflight (event gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail

          # Non-push events: never the duplicate case — always run.
          if [ "$EVENT" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::preflight: event=$EVENT — running."
            exit 0
          fi

          # Push to a non-default branch: merge_group lands on the default
          # branch only, so a same-SHA push elsewhere is a separate context
          # that should still run CI.
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::preflight: push to non-default branch ($REF_NAME) — running."
            exit 0
          fi

          # Derive the calling workflow file name from github.workflow_ref
          # (format: <owner>/<repo>/<path>@<ref>).
          WORKFLOW_FILE="${WORKFLOW_REF%@*}"
          WORKFLOW_FILE="${WORKFLOW_FILE##*/}"
          if [ -z "$WORKFLOW_FILE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::preflight: could not derive workflow file from \$WORKFLOW_REF — running (fail open)."
            exit 0
          fi

          # Scope the lookup to *this* workflow file only — another workflow
          # succeeding on merge_group for the same SHA does not prove THIS
          # workflow already ran. Failure to query (missing actions:read,
          # transient error) → fail open ("run=true").
          list_url="repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?head_sha=${SHA}&event=merge_group&per_page=100"
          runs_json=$(gh api "$list_url" 2>/dev/null || echo '{"workflow_runs":[]}')

          matched=$(echo "$runs_json" \
            | jq '[.workflow_runs[] | select(.conclusion == "success")] | length' 2>/dev/null \
            || echo 0)
          [[ "$matched" =~ ^[0-9]+$ ]] || matched=0

          if [ "$matched" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::preflight: skipping push run — workflow $WORKFLOW_FILE has $matched merge_group run(s) on SHA $SHA already validating this tree."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::preflight: running — no qualifying merge_group run for workflow $WORKFLOW_FILE on SHA $SHA."
          fi

  composer-audit:
    needs: preflight
    name: Composer Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !inputs.skip-composer-audit && needs.preflight.outputs.run == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: |
          composer config --no-plugins allow-plugins true
          composer config --no-plugins audit.block-insecure false
          eval "$COMPOSER_RETRY"
          composer_retry install --prefer-dist --no-progress

      - name: Run Composer Audit
        # The advisory endpoint is a network dependency of a REQUIRED check: when
        # packagist.org answers 5xx, `composer audit` exits 100 and every PR in
        # flight is thrown out of the merge queue (observed 2026-08-09,
        # netresearch/t3x-nr-llm#686 — HTTP 502, identical run green 30 minutes
        # earlier). `--ignore-unreachable` would fix that by making the audit
        # pass SILENTLY on any outage, which turns a security gate off exactly
        # when nobody notices. Retry instead, and only downgrade to a visible
        # warning when the source stays unreachable — a real advisory still
        # fails the job on the first attempt.
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if composer audit --format=plain --abandoned=report >audit.log 2>&1; then
              cat audit.log
              exit 0
            fi
            if grep -qiE 'could not be downloaded|failed to (open|download)|curl error|operation timed out' audit.log; then
              echo "attempt ${attempt}/3: advisory source unreachable"
              head -20 audit.log
              [ "${attempt}" -lt 3 ] && sleep $((attempt * 15))
              continue
            fi
            cat audit.log
            exit 1
          done
          cat audit.log
          echo "::warning title=Composer audit inconclusive::The advisory source was unreachable on all 3 attempts, so dependencies were NOT audited in this run. Re-run this job once the source is back."
          exit 0

  opengrep:
    needs: preflight
    name: SAST (Opengrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.skip-opengrep && needs.preflight.outputs.run == 'true' }}
    permissions:
      contents: read
      security-events: write
    env:
      # Pinned Opengrep release — bump via renovate/manual PR. Binary is
      # verified by SHA256 below; update both values together.
      OPENGREP_VERSION: v1.19.0
      OPENGREP_SHA256: 1d69a41beb88e8e7917f26cc6a16c1edf298f31402807e6d1afbb5d8684c3590
      OPENGREP_CONFIG: ${{ inputs.opengrep-config }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Opengrep
        run: |
          mkdir -p "$HOME/.local/bin"
          # Retry to ride out transient GitHub release-CDN errors (e.g. HTTP 504)
          # that otherwise fail the whole security job on a flaky download.
          # --proto/--proto-redir: -L follows redirects, and without them a
          # redirect to http would be followed too (SonarCloud S6506).
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            -o "$HOME/.local/bin/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  $HOME/.local/bin/opengrep" | sha256sum -c -
          chmod +x "$HOME/.local/bin/opengrep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch the pinned Opengrep rules
        # `--config auto` loads whatever the registry serves at run time
        # (its p/default rule set), and one changed regex there failed
        # callers that had not changed (#292). The scan step therefore runs
        # the same rule set from two pinned commits: semgrep/semgrep-rules
        # and trailofbits/semgrep-rules, the two repositories p/default is
        # built from. FILES below lists the rule files of p/default at those
        # commits; RULES_DIGEST is the sha256 of the sorted rule ids they
        # must yield. A listed file that is missing, or a rule added,
        # renamed or removed, fails the job, so moving a pin cannot shrink
        # the rule set unnoticed. Renovate proposes new pins and never
        # merges them on its own; after a bump, rebuild FILES and
        # RULES_DIGEST with Build/Scripts/refresh-opengrep-rules.sh.
        #
        # The rules are fetched, not stored in this repository: the
        # semgrep-rules files are under the Semgrep Rules License v1.0, which
        # does not allow distributing them. `git fetch` of a commit id
        # verifies the content against that id.
        env:
          # renovate: datasource=git-refs depName=https://github.com/semgrep/semgrep-rules currentValue=release
          SEMGREP_RULES_SHA: 2fc50a25e019418af75a87b7ec026f6e9f4e3257
          # renovate: datasource=git-refs depName=https://github.com/trailofbits/semgrep-rules currentValue=main
          TRAILOFBITS_RULES_SHA: 31390b3a99c04c81522d1b37c8d1900aa2dd4094
          RULES_DIGEST: 725482bbbcd8439ab473c0139bd114ef92658bada2243dc779e505518e0a14a0
        run: |
          set -euo pipefail

          # Only `--config auto` uses the pinned set; the scan step maps the
          # same spellings.
          ARGS=()
          read -r -a ARGS <<< "$OPENGREP_CONFIG" || :
          uses_auto=false
          for (( i = 0; i < ${#ARGS[@]}; i++ )); do
            case "${ARGS[i]}" in
              --config | -c | -f)
                [[ "${ARGS[i + 1]:-}" == auto ]] && uses_auto=true
                ;;
              --config=auto)
                uses_auto=true
                ;;
            esac
          done
          if [[ "$uses_auto" != true ]]; then
            echo "::notice::opengrep-config has no --config auto; the pinned rule set is not fetched"
            exit 0
          fi

          PINNED="${RUNNER_TEMP}/opengrep-pinned"
          TREE="${PINNED}/tree"

          # fetch DIR REPO SHA: a shallow checkout of one commit.
          fetch() {
            local attempt
            mkdir -p "$1"
            git -C "$1" init -q
            for attempt in 1 2 3; do
              if git -C "$1" fetch -q --depth 1 "https://github.com/$2.git" "$3"; then
                break
              fi
              if [[ "$attempt" == 3 ]]; then
                echo "::error::fetching $2 at $3 failed on all 3 attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
            git -C "$1" -c advice.detachedHead=false checkout -q FETCH_HEAD
          }
          fetch "$TREE" semgrep/semgrep-rules "$SEMGREP_RULES_SHA"
          fetch "$TREE/trailofbits" trailofbits/semgrep-rules "$TRAILOFBITS_RULES_SHA"

          cat > "${PINNED}/files.txt" <<'FILES'
          # BEGIN pinned rule files: written by Build/Scripts/refresh-opengrep-rules.sh
          bash/curl/security/curl-eval.yaml
          bash/curl/security/curl-pipe-bash.yaml
          bash/lang/security/ifs-tampering.yaml
          c/lang/security/insecure-use-gets-fn.yaml
          c/lang/security/insecure-use-scanf-fn.yaml
          c/lang/security/insecure-use-strtok-fn.yaml
          c/lang/security/random-fd-exhaustion.yaml
          clojure/lang/security/documentbuilderfactory-xxe.yaml
          clojure/lang/security/use-of-md5.yaml
          clojure/lang/security/use-of-sha1.yaml
          csharp/dotnet/security/audit/mass-assignment.yaml
          csharp/dotnet/security/mvc-missing-antiforgery.yaml
          csharp/dotnet/security/net-webconfig-debug.yaml
          csharp/dotnet/security/net-webconfig-trace-enabled.yaml
          csharp/dotnet/security/razor-template-injection.yaml
          csharp/dotnet/security/use_ecb_mode.yaml
          csharp/dotnet/security/use_weak_rng_for_keygeneration.yaml
          csharp/dotnet/security/web-config-insecure-cookie-settings.yaml
          csharp/lang/security/ad/jwt-tokenvalidationparameters-no-expiry-validation.yaml
          csharp/lang/security/cryptography/X509-subject-name-validation.yaml
