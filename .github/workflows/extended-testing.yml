name: Extended Testing

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version for coverage runs
        required: false
        type: string
        default: '8.5'
      node-version:
        description: Node.js version for JS testing
        required: false
        type: string
        default: '24'
      run-unit-tests:
        description: Run PHP unit tests with coverage
        required: false
        type: boolean
        default: true
      run-functional-tests:
        description: Run PHP functional tests with coverage
        required: false
        type: boolean
        default: true
      run-integration-tests:
        description: Run PHP integration tests with coverage
        required: false
        type: boolean
        default: false
      run-e2e-tests:
        description: Run PHP E2E tests with coverage
        required: false
        type: boolean
        default: false
      run-js-tests:
        description: Run JavaScript tests (Vitest)
        required: false
        type: boolean
        default: true
      run-mutation-tests:
        description: Run PHP mutation testing (Infection)
        required: false
        type: boolean
        default: true
      run-fuzz-tests:
        description: Run PHP fuzz tests
        required: false
        type: boolean
        default: true
      infection-config:
        description: 'Infection configuration file; empty lets Infection find its own (infection.json5, infection.json, infection.json.dist)'
        required: false
        type: string
        default: ''
      unit-testsuite:
        description: 'Testsuite name inside the unit config'
        required: false
        type: string
        default: 'Unit Tests'
      functional-testsuite:
        description: 'Testsuite name inside the functional config'
        required: false
        type: string
        default: 'Functional Tests'
      integration-testsuite:
        description: 'Testsuite name inside the integration config'
        required: false
        type: string
        default: 'Integration Tests'
      e2e-testsuite:
        description: 'Testsuite name inside the e2e config'
        required: false
        type: string
        default: 'E2E Tests'
      unit-test-config:
        description: PHPUnit config for unit tests
        required: false
        type: string
        default: 'Build/phpunit/UnitTests.xml'
      functional-test-config:
        description: PHPUnit config for functional tests
        required: false
        type: string
        default: 'Build/phpunit/FunctionalTests.xml'
      integration-test-config:
        description: PHPUnit config for integration tests
        required: false
        type: string
        default: 'Build/phpunit/IntegrationTests.xml'
      e2e-test-config:
        description: PHPUnit config for E2E tests
        required: false
        type: string
        default: 'Build/phpunit/E2ETests.xml'
    secrets:
      CODECOV_TOKEN:
        required: false
      INFECTION_DASHBOARD_API_KEY:
        required: false

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     unit-coverage:
#       uses: netresearch/typo3-ci-workflows/.github/workflows/extended-testing.yml@main
#       permissions:
#         contents: read
permissions: {}

# Composer aborts on the first transient network failure: its CurlDownloader
# retries curl errno 6/7/16/28/92 (and 35/56 on "Connection reset by peer")
# and throws on everything else, so an intermittent TLS abort against
# api.github.com — errno 60, seen across several repositories — kills the job
# and only a re-run clears it, which is also how a real regression gets waved
# through. `composer_retry` retries up to three times, but only when the
# failure output actually names a transport error; a dependency-resolution
# failure still fails on the first attempt.
env:
  COMPOSER_RETRY: |
    composer_retry() {
      local attempt status log
      log=$(mktemp)
      for attempt in 1 2 3; do
        set +e
        composer "$@" 2>&1 | tee "$log"
        status=${PIPESTATUS[0]}
        set -e
        if [[ "$status" == 0 ]]; then
          rm -f "$log"
          return 0
        fi
        if ! grep -qiE 'curl error|failed to download|could not be downloaded|could not fetch|could not resolve host|ssl certificate problem|operation timed out|connection reset' "$log"; then
          rm -f "$log"
          echo "::error::composer $* failed (exit $status) with no transport error in its output; not retried"
          return "$status"
        fi
        if [[ "$attempt" == 3 ]]; then
          rm -f "$log"
          echo "::error::composer $* failed on all 3 attempts (exit $status)"
          return "$status"
        fi
        echo "::warning::composer $* hit a network error (exit $status, attempt $attempt/3); retrying"
        sleep $((attempt * 5))
      done
    }

jobs:
  unit-coverage:
    name: Unit Coverage
    if: inputs.run-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: pcov
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: |
          eval "$COMPOSER_RETRY"
          composer_retry install --no-progress

      - name: Run tests with coverage
        env:
          PHPUNIT_CONFIG: ${{ inputs.unit-test-config }}
          UNIT_TESTSUITE: ${{ inputs.unit-testsuite }}
        run: |
          mkdir -p .Build/coverage
          .Build/bin/phpunit -c "$PHPUNIT_CONFIG" \
            --testsuite="${UNIT_TESTSUITE}" \
            --coverage-clover=.Build/coverage/unit-clover.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: .Build/coverage/unit-clover.xml
          flags: php-unit
          name: php-unit
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  functional-coverage:
    name: Functional Coverage
    if: inputs.run-functional-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: pcov
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: |
          eval "$COMPOSER_RETRY"
          composer_retry install --no-progress

      - name: Run tests with coverage
        env:
          PHPUNIT_CONFIG: ${{ inputs.functional-test-config }}
          FUNCTIONAL_TESTSUITE: ${{ inputs.functional-testsuite }}
        run: |
          mkdir -p .Build/coverage
          .Build/bin/phpunit -c "$PHPUNIT_CONFIG" \
            --testsuite="${FUNCTIONAL_TESTSUITE}" \
            --coverage-clover=.Build/coverage/functional-clover.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: .Build/coverage/functional-clover.xml
          flags: php-functional
          name: php-functional
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-coverage:
    name: Integration Coverage
    if: inputs.run-integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: pcov
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: |
          eval "$COMPOSER_RETRY"
          composer_retry install --no-progress

      - name: Run tests with coverage
        env:
          PHPUNIT_CONFIG: ${{ inputs.integration-test-config }}
          INTEGRATION_TESTSUITE: ${{ inputs.integration-testsuite }}
        run: |
          mkdir -p .Build/coverage
          .Build/bin/phpunit -c "$PHPUNIT_CONFIG" \
            --testsuite="${INTEGRATION_TESTSUITE}" \
            --coverage-clover=.Build/coverage/integration-clover.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: .Build/coverage/integration-clover.xml
          flags: php-integration
          name: php-integration
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e-coverage:
    name: E2E Coverage
    if: inputs.run-e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: pcov
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: |
          eval "$COMPOSER_RETRY"
          composer_retry install --no-progress

      - name: Run tests with coverage
        env:
          PHPUNIT_CONFIG: ${{ inputs.e2e-test-config }}
          E2E_TESTSUITE: ${{ inputs.e2e-testsuite }}
        run: |
          mkdir -p .Build/coverage
          .Build/bin/phpunit -c "$PHPUNIT_CONFIG" \
            --testsuite="${E2E_TESTSUITE}" \
            --coverage-clover=.Build/coverage/e2e-clover.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: .Build/coverage/e2e-clover.xml
          flags: php-e2e
          name: php-e2e
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  mutation-testing:
    name: Mutation Testing (PHP)
    if: inputs.run-mutation-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-coverage
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: pcov
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: |
          eval "$COMPOSER_RETRY"
          composer_retry install --no-progress

      - name: Generate coverage for Infection
        env:
          UNIT_CONFIG: ${{ inputs.unit-test-config }}
          UNIT_TESTSUITE: ${{ inputs.unit-testsuite }}
        run: |
          mkdir -p .Build/logs
          .Build/bin/phpunit -c "$UNIT_CONFIG" \
            --testsuite="${UNIT_TESTSUITE}" \
            --coverage-xml=.Build/logs/coverage-xml \
            --log-junit=.Build/logs/junit.xml

      - name: Run mutation testing
        env:
          INFECTION_DASHBOARD_API_KEY: ${{ secrets.INFECTION_DASHBOARD_API_KEY }}
          INFECTION_CONFIG: ${{ inputs.infection-config }}
          UNIT_TESTSUITE: ${{ inputs.unit-testsuite }}
        run: |
          .Build/bin/infection --threads=4 --no-progress --logger-github \
            ${INFECTION_CONFIG:+--configuration="${INFECTION_CONFIG}"} \
            --skip-initial-tests --coverage=.Build/logs \
            --test-framework-options="--testsuite='${UNIT_TESTSUITE}'"

  js-coverage:
    name: JavaScript Coverage
    if: inputs.run-js-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload JS coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          flags: javascript
          name: js-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fuzz-testing:
    name: Fuzz Testing (PHP)
    if: inputs.run-fuzz-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2

      - name: Install dependencies
        run: |
          eval "$COMPOSER_RETRY"
          composer_retry install --no-progress

      - name: Run fuzz tests
        env:
          UNIT_CONFIG: ${{ inputs.unit-test-config }}
          UNIT_TESTSUITE: ${{ inputs.unit-testsuite }}
        run: |
          .Build/bin/phpunit -c "$UNIT_CONFIG" \
            --testsuite="${UNIT_TESTSUITE}" \
            --group=fuzz
